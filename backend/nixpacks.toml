[phases.setup]
nixPkgs = ["php82", "php82Extensions.pdo", "php82Extensions.pdo_mysql",
           "php82Extensions.mbstring", "php82Extensions.xml",
           "php82Extensions.curl", "php82Extensions.zip",
           "php82Extensions.bcmath", "php82Extensions.tokenizer", "composer"]

[phases.build]
cmds = [
  "composer install --no-dev --optimize-autoloader",
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache"
]

[start]
cmd = "php artisan migrate --force && php artisan session:table --force 2>/dev/null; php artisan migrate --force && php -S 0.0.0.0:$PORT -t public"